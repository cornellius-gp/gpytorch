# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
  jobs:
    pre_install:  # Lock dependencies at their minimum supported versions
      - pip install "numpy>=2.0,<2.1"
      - pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
    pre_build:
      - pip install "setuptools<78"  # setuptools 78+ removed pkg_resources, which m2r2 needs
      - python -m setuptools_scm  # Get correct version number

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# Optionally build your docs in additional formats such as PDF
#formats:
  #- pdf

# Optionally set the version of Python and requirements required to build your docs
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - pyro
